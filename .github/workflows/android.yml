name: Android APK

# Builds an installable test APK whenever the shared interface or the Android app changes.
# Download it from the run's Artifacts section on GitHub.
on:
  push:
    branches: [main]
    paths:
      - 'app/ui/**'
      - 'app/shared/**'
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Copy the shared interface
        working-directory: mobile
        run: node build-www.mjs

      - name: Create the Android project
        working-directory: mobile
        run: |
          npx cap add android
          npx cap sync android

      - name: Build the test APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "dist/DriveAtlas-${GITHUB_SHA::7}-test.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DriveAtlas-test-apk
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error
