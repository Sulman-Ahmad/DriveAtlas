name: Build and release

# Builds the Android app on every change, signed with the same key each time (repository secrets
# ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD), so a new version installs over the old one and the
# phone keeps its catalog. Builds DriveAtlas.exe for Windows on a Windows machine, with the newest Node.js 24 LTS
# installer inside it (checked against nodejs.org's SHA-256 list). Every build is kept as a download on the run's page.
# When the version in app/package.json and mobile/package.json has no release yet (for example 0.4.0-beta.2),
# the build is published to GitHub Releases as "v<version>" with DriveAtlas.exe, the APK and a Windows zip;
# versions with a dash (beta) are marked as pre-releases.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'mobile/**'
      - 'DriveAtlas.vbs'
      - 'DriveAtlas.cmd'
      - 'build/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

# Library downloads from the internet sometimes time out on GitHub's machines: wait longer and retry.
env:
  GRADLE_NET: >-
    -Dorg.gradle.internal.http.connectionTimeout=120000
    -Dorg.gradle.internal.http.socketTimeout=120000
    -Dorg.gradle.internal.repository.max.retries=6
    -Dorg.gradle.internal.repository.initial.backoff=2000

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_name: ${{ steps.version.outputs.version_name }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
      has_key: ${{ env.HAS_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Work out the version, and whether this build becomes a release
        id: version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./mobile/package.json').version")"
          APP_VERSION="$(node -p "require('./app/package.json').version")"
          if [ "$VERSION" != "$APP_VERSION" ]; then echo "::error::app/package.json ($APP_VERSION) and mobile/package.json ($VERSION) must have the same version"; exit 1; fi
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            RELEASE=false; VERSION_NAME="${VERSION}-build.${GITHUB_RUN_NUMBER}"
          else
            RELEASE=true; VERSION_NAME="${VERSION}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "RELEASE=${RELEASE}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          { echo "version=${VERSION}"; echo "version_name=${VERSION_NAME}"; echo "tag=${TAG}"; echo "release=${RELEASE}"; } >> "$GITHUB_OUTPUT"
          echo "Version ${VERSION_NAME}; release: ${RELEASE}"

      - name: Install Capacitor
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Copy the shared interface
        working-directory: mobile
        run: node build-www.mjs

      - name: Create the Android project with DriveAtlas's own code, icon and splash screen
        working-directory: mobile
        run: |
          npx cap add android
          node native/patch-android.mjs
          npx capacitor-assets generate --android --iconBackgroundColor '#0F766E' --iconBackgroundColorDark '#0F766E' --splashBackgroundColor '#F4F7F6' --splashBackgroundColorDark '#0C1312'
          npx cap sync android

      - name: Set the version
        working-directory: mobile/android/app
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/" build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle

      - name: Build the release APK
        if: env.HAS_KEY == 'true'
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace $GRADLE_NET || ./gradlew assembleRelease --no-daemon --stacktrace $GRADLE_NET

      - name: Sign the APK
        if: env.HAS_KEY == 'true'
        env:
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "$KS_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          UNSIGNED=mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p dist
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 --ks-key-alias driveatlas \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out "dist/DriveAtlas-${VERSION_NAME}.apk" "$RUNNER_TEMP/aligned.apk"
          # The verifier's own result is the check; its full output shows which key signed the APK.
          "$BT/apksigner" verify --verbose --print-certs "dist/DriveAtlas-${VERSION_NAME}.apk"
          echo "Signed with the DriveAtlas key: dist/DriveAtlas-${VERSION_NAME}.apk"
          rm -f "$RUNNER_TEMP/release.p12"

      - name: Build a test APK (no signing key yet)
        if: env.HAS_KEY != 'true'
        working-directory: mobile/android
        run: |
          echo "::warning::Signing key secrets are not set, so this APK uses a throwaway key and is not published to Releases."
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace $GRADLE_NET || ./gradlew assembleDebug --no-daemon --stacktrace $GRADLE_NET
          mkdir -p ../../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../../dist/DriveAtlas-${VERSION_NAME}-unsigned-test.apk"

      - name: Pack the Windows app
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --prefix=DriveAtlas/ -o "dist/DriveAtlas-Windows-${VERSION_NAME}.zip" HEAD DriveAtlas.vbs DriveAtlas.cmd app README.md LICENSE.md
          unzip -l "dist/DriveAtlas-Windows-${VERSION_NAME}.zip" | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: DriveAtlas-${{ env.VERSION_NAME }}
          path: dist/*
          retention-days: 30
          if-no-files-found: error

  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      VERSION_NAME: ${{ needs.build.outputs.version_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download the newest Node.js 24 LTS installer and check it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/node" && cd "$RUNNER_TEMP/node"
          curl -fsSL --retry 4 -o index.json https://nodejs.org/dist/index.json
          NODE_V="$(node -e "const r = JSON.parse(require('fs').readFileSync('index.json', 'utf8')).find((x) => x.version.startsWith('v24.') && x.lts && x.files.includes('win-x64-msi')); if (!r) process.exit(1); console.log(r.version)")"
          curl -fsSL --retry 4 -O "https://nodejs.org/dist/${NODE_V}/node-${NODE_V}-x64.msi"
          curl -fsSL --retry 4 -O "https://nodejs.org/dist/${NODE_V}/SHASUMS256.txt"
          grep " node-${NODE_V}-x64.msi$" SHASUMS256.txt | sha256sum -c -
          echo "NODE_MSI=$(cygpath -w "$RUNNER_TEMP/node/node-${NODE_V}-x64.msi")" >> "$GITHUB_ENV"
          echo "NODE_V=${NODE_V}" >> "$GITHUB_ENV"
          echo "Node.js ${NODE_V} installer verified"

      - name: Build DriveAtlas.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File build\Build-DriveAtlas.ps1 -NodeMsi $env:NODE_MSI -OutDir dist -BuildNumber $env:GITHUB_RUN_NUMBER
          if ($LASTEXITCODE -ne 0) { throw "build failed ($LASTEXITCODE)" }
          $exe = "dist\DriveAtlas-Windows-$env:VERSION_NAME.exe"
          Move-Item dist\DriveAtlas.exe $exe
          # It starts on .NET and finds no running DriveAtlas to stop: exit code 1.
          $p = Start-Process -FilePath $exe -ArgumentList '--exit' -Wait -PassThru
          if ($p.ExitCode -ne 1) { throw "DriveAtlas.exe --exit returned $($p.ExitCode)" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          $sha = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          "$exe : version $((Get-Item $exe).VersionInfo.ProductVersion), Node.js $env:NODE_V inside, $mb MB, SHA-256 $sha"

      - uses: actions/upload-artifact@v4
        with:
          name: DriveAtlas-Windows-exe-${{ env.VERSION_NAME }}
          path: dist/*.exe
          retention-days: 30
          if-no-files-found: error

  release:
    needs: [build, windows]
    if: needs.build.outputs.has_key == 'true' && needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l dist
          TITLE="DriveAtlas $(node -p "process.env.VERSION.replace(/-beta\.(\d+)$/, ' beta \$1').replace(/-rc\.(\d+)$/, ' release candidate \$1')")"
          PRE=""
          case "$VERSION" in *-*) PRE="--prerelease" ;; esac
          {
            git log -1 --format=%B "$GITHUB_SHA"
            echo
            echo "## Install"
            echo
            echo "- **Windows:** download \`DriveAtlas-Windows-${VERSION}.exe\` and double-click it. Node.js is included: if your PC doesn't have it, DriveAtlas offers to install it. It then adds itself to the Start menu and shows an icon in the system tray. If Windows SmartScreen says \"Windows protected your PC\", click **More info** and **Run anyway** (DriveAtlas isn't code-signed yet). Your catalog stays where it is."
            echo "- **Android:** download \`DriveAtlas-${VERSION}.apk\` on your phone and open it (allow \"Install unknown apps\" once). It installs over an earlier version and keeps your catalog."
            echo "- **Windows zip, if you already have Node.js 22.13 or newer:** download \`DriveAtlas-Windows-${VERSION}.zip\`, unzip it, and double-click \`DriveAtlas.vbs\`."
            echo "- Use the same version on your PC and phone to sync."
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" dist/*.exe dist/*.apk dist/*.zip --target "$GITHUB_SHA" $PRE --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md"
