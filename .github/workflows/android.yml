name: Build and release

# Builds the Android app on every change, signed with the same key each time (repository secrets
# ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD), so a new version installs over the old one and the
# phone keeps its catalog. Every build is kept as a download on the run's page.
# When the version in app/package.json and mobile/package.json has no release yet (for example 0.4.0-beta.1),
# the build is published to GitHub Releases as "v<version>" with the APK and a Windows zip; versions with a
# dash (beta) are marked as pre-releases.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'mobile/**'
      - 'DriveAtlas.vbs'
      - 'DriveAtlas.cmd'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

# Library downloads from the internet sometimes time out on GitHub's machines: wait longer and retry.
env:
  GRADLE_NET: >-
    -Dorg.gradle.internal.http.connectionTimeout=120000
    -Dorg.gradle.internal.http.socketTimeout=120000
    -Dorg.gradle.internal.repository.max.retries=6
    -Dorg.gradle.internal.repository.initial.backoff=2000

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Work out the version, and whether this build becomes a release
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./mobile/package.json').version")"
          APP_VERSION="$(node -p "require('./app/package.json').version")"
          if [ "$VERSION" != "$APP_VERSION" ]; then echo "::error::app/package.json ($APP_VERSION) and mobile/package.json ($VERSION) must have the same version"; exit 1; fi
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            RELEASE=false; VERSION_NAME="${VERSION}-build.${GITHUB_RUN_NUMBER}"
          else
            RELEASE=true; VERSION_NAME="${VERSION}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "RELEASE=${RELEASE}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "Version ${VERSION_NAME}; release: ${RELEASE}"

      - name: Install Capacitor
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Copy the shared interface
        working-directory: mobile
        run: node build-www.mjs

      - name: Create the Android project with DriveAtlas's own code, icon and splash screen
        working-directory: mobile
        run: |
          npx cap add android
          node native/patch-android.mjs
          npx capacitor-assets generate --android --iconBackgroundColor '#0F766E' --iconBackgroundColorDark '#0F766E' --splashBackgroundColor '#F4F7F6' --splashBackgroundColorDark '#0C1312'
          npx cap sync android

      - name: Set the version
        working-directory: mobile/android/app
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/" build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle

      - name: Build the release APK
        if: env.HAS_KEY == 'true'
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace $GRADLE_NET || ./gradlew assembleRelease --no-daemon --stacktrace $GRADLE_NET

      - name: Sign the APK
        if: env.HAS_KEY == 'true'
        env:
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "$KS_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          UNSIGNED=mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p dist
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 --ks-key-alias driveatlas \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out "dist/DriveAtlas-${VERSION_NAME}.apk" "$RUNNER_TEMP/aligned.apk"
          # The verifier's own result is the check; its full output shows which key signed the APK.
          "$BT/apksigner" verify --verbose --print-certs "dist/DriveAtlas-${VERSION_NAME}.apk"
          echo "Signed with the DriveAtlas key: dist/DriveAtlas-${VERSION_NAME}.apk"
          rm -f "$RUNNER_TEMP/release.p12"

      - name: Build a test APK (no signing key yet)
        if: env.HAS_KEY != 'true'
        working-directory: mobile/android
        run: |
          echo "::warning::Signing key secrets are not set, so this APK uses a throwaway key and is not published to Releases."
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace $GRADLE_NET || ./gradlew assembleDebug --no-daemon --stacktrace $GRADLE_NET
          mkdir -p ../../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../../dist/DriveAtlas-${VERSION_NAME}-unsigned-test.apk"

      - name: Pack the Windows app
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --prefix=DriveAtlas/ -o "dist/DriveAtlas-Windows-${VERSION_NAME}.zip" HEAD DriveAtlas.vbs DriveAtlas.cmd app README.md LICENSE.md
          unzip -l "dist/DriveAtlas-Windows-${VERSION_NAME}.zip" | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: DriveAtlas-${{ env.VERSION_NAME }}
          path: dist/*
          retention-days: 30
          if-no-files-found: error

      - name: Publish the release
        if: env.HAS_KEY == 'true' && env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="DriveAtlas $(node -p "process.env.VERSION.replace(/-beta\.(\d+)$/, ' beta \$1').replace(/-rc\.(\d+)$/, ' release candidate \$1')")"
          PRE=""
          case "$VERSION" in *-*) PRE="--prerelease" ;; esac
          {
            git log -1 --format=%B "$GITHUB_SHA"
            echo
            echo "## Install"
            echo
            echo "- **Android:** download \`DriveAtlas-${VERSION}.apk\` on your phone and open it (allow \"Install unknown apps\" once). It installs over an earlier version and keeps your catalog."
            echo "- **Windows:** download \`DriveAtlas-Windows-${VERSION}.zip\`, unzip it, and double-click \`DriveAtlas.vbs\`. Needs Node.js 22.13 or newer from nodejs.org. Your catalog stays where it is."
            echo "- Use the same version on your PC and phone to sync."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" dist/*.apk dist/*.zip --target "$GITHUB_SHA" $PRE --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md"
